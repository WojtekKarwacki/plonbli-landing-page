services:
  site:
    image: od-swoich-site
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - healthcheck.mjs
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
