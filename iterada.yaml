version: 1

adapters:
  delivery:
    mode: process
    entrypoint: ["node", "scripts/iterada-delivery.mjs"]
    timeout_seconds: 1800
  project:
    mode: project

workflows:
  tests:
    capability: test
    adapter: delivery
    name: Unit and integration tests
    default: true
    steps:
      - id: install
        name: Install locked dependencies
      - id: test
        name: Run unit and integration tests
        needs: [install]
    target:
      kind: command
      commands:
        - id: install
          label: Install locked dependencies
          argv: ["npm", "ci"]
        - id: test
          label: Run unit and integration tests
          argv: ["npm", "test"]

  e2e:
    capability: e2e
    adapter: delivery
    name: Product tests
    default: true
    steps:
      - id: install
        name: Install locked dependencies
      - id: build
        name: Build the private product copy
        needs: [install]
      - id: browser
        name: Prepare the browser engine
        needs: [build]
      - id: journeys
        name: Walk the product journeys
        needs: [browser]
    target:
      kind: command
      commands:
        - id: install
          label: Install locked dependencies
          argv: ["npm", "ci"]
        - id: build
          label: Build the private product copy
          argv: ["npm", "run", "build"]
        - id: browser
          label: Prepare the browser engine
          argv: ["npx", "playwright", "install", "chromium"]
        - id: journeys
          label: Walk the product journeys
          argv: ["npm", "run", "test:e2e:run", "--", "--project=chromium"]

  build:
    capability: build
    adapter: delivery
    name: Production build
    default: true
    steps:
      - id: install
        name: Install locked dependencies
      - id: build
        name: Build and prerender the site
        needs: [install]
      - id: verify
        name: Verify the published files
        needs: [build]
    target:
      kind: command
      commands:
        - id: install
          label: Install locked dependencies
          argv: ["npm", "ci"]
        - id: build
          label: Build and prerender the site
          argv: ["npm", "run", "build"]
        - id: verify
          label: Verify the published files
          argv: ["npm", "run", "verify:dist"]

  production:
    capability: deploy
    adapter: project
    name: Deploy production
    default: true
    target:
      compose: compose.yaml
      service: site
      port: 8080
      hostname:
        - plonbli.iterada.com

  preview:
    capability: preview
    adapter: project
    name: Preview the site
    default: true
    based_on: production
    overrides:
      hostname: []

  observe:
    capability: observe
    adapter: delivery
    name: Production health
    default: true
    target:
      kind: http-observe
      origin: https://plonbli.iterada.com
      direct_host: iterada.com
